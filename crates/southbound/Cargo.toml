[package]
name = "weave-southbound"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Adapter-facing southbound API for open-weave: node registration, telemetry and endpoint discovery."
keywords = ["media", "srt", "webrtc", "streaming", "api"]
categories = ["web-programming::http-server", "multimedia::video"]

[[bin]]
name = "weave-southbound"
path = "src/main.rs"

[dependencies]
weave-core = { workspace = true, features = ["server"] }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
tower-http = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
http-body-util = { workspace = true }

[lints]
workspace = true
