[package]
name = "weave-northbound"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Northbound desired-state API for open-weave, the live media contribution control plane."
keywords = ["media", "srt", "webrtc", "streaming", "api"]
categories = ["web-programming::http-server", "multimedia::video"]

[[bin]]
name = "weave-northbound"
path = "src/main.rs"

[dependencies]
weave-core = { workspace = true, features = ["server"] }
