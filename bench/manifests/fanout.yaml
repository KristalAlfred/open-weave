# Fan-out: one source relayed to two destinations.
name: fanout
enabled: true
source:
  srt:
    url: srt://0.0.0.0:7001
    mode: listener
    latency: 200
    node: strom-node-1
destinations:
  - srt:
      url: srt://172.27.0.10:7002
      mode: caller
      latency: 1000
      node: strom-node-2
  - srt:
      url: srt://172.26.0.10:7002
      mode: caller
      latency: 1000
      node: strom-node-1
