# Canonical contribution: listener on node-1 :7001 relayed to node-2 :7002.
# Drives the producer/consumer verification endpoints.
name: basic
enabled: true
source:
  srt:
    url: srt://0.0.0.0:7001
    mode: listener
    latency: 200
    node: strom-node-1
destinations:
  - srt:
      url: srt://172.27.0.10:7002
      mode: caller
      latency: 1000
