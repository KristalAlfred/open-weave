# Both ends on the same NAT'd node, pinned through node 1.
# Both node-3 hops call out to node 1, so the media crosses the NAT twice,
# outbound each time. `nat-transit` is the unpinned case between two NAT'd sites.
name: nat-relay
enabled: true
source:
  srt:
    node: strom-node-3
    latency: 200
destinations:
  - id: output
    srt:
      node: strom-node-3
      via: [strom-node-1]
      latency: 1000
