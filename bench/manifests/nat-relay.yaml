# Both ends on the same NAT'd node, pinned through node 1.
# Both node-3 hops call out to node 1. Automatic transit is covered by planner
# tests with two separate dial-only routing domains.
# are the same node because the bench has one NAT'd site; the media still
# crosses the NAT twice, outbound each time, which is the mechanism two separate
# NAT'd sites would rely on.
name: nat-relay
enabled: true
source:
  srt:
    node: strom-node-3
    latency: 200
destinations:
  - id: output
    srt:
      node: strom-node-3
      via: [strom-node-1]
      latency: 1000
