# Source pinned to a node that never registers: stays pending, never provisions.
# Kubernetes-style unschedulable — it places as soon as that node appears.
name: unplaceable
enabled: true
source:
  srt:
    node: strom-node-404
    latency: 200
destinations:
  - srt:
      node: strom-node-2
      latency: 1000
