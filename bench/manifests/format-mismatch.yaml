# Format mismatch: a 48 kHz source into a 44.1 kHz-only destination.
# The path is placeable and the media flows — it just arrives somewhere it
# cannot be used — so the stream is reported degraded with the offending field
# named. Nothing converts it yet; saying so is the point.
name: format-mismatch
enabled: true
source:
  srt:
    node: strom-node-1
    latency: 200
    format:
      container: mpeg_ts
      video:
        codec: h264
        width: 1280
        height: 720
        framerate: { numerator: 30, denominator: 1 }
        chroma_subsampling: yuv420
      audio:
        codec: aac
        sample_rate: 48000
        channels: 1
destinations:
  - srt:
      node: strom-node-2
      latency: 1000
      accepts:
        audio:
          sample_rate: [44100]
