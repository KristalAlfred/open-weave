# Node 2 Strom adapter config. Mounted read-only and passed via --config.
node:
  id: strom-node-2
  southbound_url: http://10.97.25.21:8081
  # Bearer token presented to southbound. Left unset here so the value stays
  # out of the repo: it falls back to WEAVE_SOUTHBOUND_TOKEN, which
  # docker-compose.yml passes in. Set it inline to pin it per node:
  #   southbound_token: <token>
  listen: 0.0.0.0:8091
  public_endpoint: http://10.97.27.11:8091
  topology:
    attachments:
      - id: routed
        network: internet
        dial: true
        listeners:
          srt:
            host: 10.97.27.10
            port_range: { start: 20000, end: 20999 }
strom:
  url: http://10.97.27.10:8080
  poll_interval_secs: 5
