# nginx in front of northbound (9443) and southbound (8443), serving the
# certificate scripts/tls-certs.sh generates.
events {}

http {
    ssl_certificate     /tls/server.pem;
    ssl_certificate_key /tls/server.key;

    server {
        listen 9443 ssl;
        location / {
            proxy_pass http://10.97.25.20:9080;
        }
    }

    server {
        listen 8443 ssl;
        location / {
            proxy_pass http://10.97.25.21:8081;
        }
    }
}
