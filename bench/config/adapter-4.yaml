# Node 4 Strom adapter config. Mounted read-only and passed via --config.
#
# A second NAT'd site, set up like node 3 behind router-4. Its site network has
# its own name: sharing `node-3-local` would tell the planner that nodes 3 and 4
# can dial each other, which router-3 and router-4 do not allow.
node:
  id: strom-node-4
  southbound_url: https://10.97.25.25:8443
  listen: 0.0.0.0:8091
  public_endpoint: http://10.97.30.11:8091
  topology:
    attachments:
      - id: outbound
        network: internet
        dial: true
      - id: site
        network: node-4-local
        dial: true
        listeners:
          srt:
            host: 10.97.30.10
            port_range: { start: 20000, end: 20999 }
strom:
  url: http://10.97.30.10:8080
  poll_interval_secs: 5
