# Node 1 Strom adapter config. Mounted read-only and passed via --config.
node:
  id: strom-node-1
  southbound_url: http://10.97.25.21:8081
  # This node's own southbound token. Left unset here: it falls back to
  # WEAVE_SOUTHBOUND_TOKEN, which docker-compose.yml sets to strom-node-1's
  # token. Set it inline to pin it here instead:
  #   southbound_token: <token>
  listen: 0.0.0.0:8091
  public_endpoint: http://10.97.26.11:8091
  topology:
    attachments:
      - id: a-routed
        network: internet
        dial: true
        listeners:
          srt:
            host: 10.97.26.10
            port_range: { start: 20000, end: 20999 }
          whip: { base_url: http://10.97.26.10:8080/whip }
          whep: { base_url: http://10.97.26.10:8080/whep }
      - id: z-docker-host
        network: docker-host
        dial: true
        listeners:
          srt:
            host: 10.97.26.10
            port_range: { start: 20000, end: 20999 }
          whip: { base_url: http://localhost:28080/whip }
          whep: { base_url: http://localhost:28080/whep }
strom:
  url: http://10.97.26.10:8080
  poll_interval_secs: 5
