# Node 1 Strom adapter config. Mounted read-only and passed via --config.
node:
  id: strom-node-1
  southbound_url: http://172.25.0.21:8081
  # Bearer token presented to southbound. Left unset here so the value stays
  # out of the repo: it falls back to WEAVE_SOUTHBOUND_TOKEN, which
  # docker-compose.yml passes in. Set it inline to pin it per node:
  #   southbound_token: <token>
  listen: 0.0.0.0:8091
  public_endpoint: http://172.26.0.11:8091
  data_plane:
    default: 172.26.0.10
  port_range:
    start: 20000
    end: 20999
  transports: [srt]
strom:
  url: http://172.26.0.10:8080
  poll_interval_secs: 5
