name: ow-bench

x-weave: &weave
  image: open-weave-bench:local
  build:
    context: ..
    dockerfile: bench/Dockerfile
  restart: unless-stopped

# External verification endpoints share one ffmpeg loop each; only the container
# name, address and subnet differ. Every consumer reads CONSUMER_SOURCE, so a
# service that takes its value from a different host variable remaps it in its
# own `environment` block rather than forking the command.
x-media: &media
  image: linuxserver/ffmpeg:latest
  restart: "no"
  entrypoint: ["/bin/bash", "-c"]

x-producer-command: &producer-command
  - |
    running=1
    trap 'running=0; kill -TERM "$$child" 2>/dev/null' TERM INT
    while [ "$$running" = 1 ]; do
      ffmpeg -hide_banner -loglevel warning -re \
        -f lavfi -i testsrc2=size=1280x720:rate=30 \
        -f lavfi -i sine=frequency=1000:sample_rate=48000 \
        -c:v libx264 -preset veryfast -tune zerolatency -b:v 2500k -pix_fmt yuv420p -g 60 \
        -c:a aac -b:a 128k \
        -f mpegts "srt://$${PRODUCER_TARGET:?PRODUCER_TARGET is required (resolve via scripts/endpoints.sh)}?mode=caller&latency=200&streamid=producer" &
      child=$$!
      wait "$$child" || true
      [ "$$running" = 1 ] && { echo "producer ffmpeg exited; retrying in 2s" >&2; sleep 2; }
    done
    wait "$$child" 2>/dev/null || true

x-consumer-command: &consumer-command
  - |
    running=1
    trap 'running=0; kill -TERM "$$child" 2>/dev/null' TERM INT
    while [ "$$running" = 1 ]; do
      ffmpeg -hide_banner -loglevel warning \
        -i "srt://$${CONSUMER_SOURCE:?CONSUMER_SOURCE is required (resolve via scripts/endpoints.sh)}?mode=caller&latency=200" \
        -f null - &
      child=$$!
      wait "$$child" || true
      [ "$$running" = 1 ] && { echo "consumer ffmpeg exited; retrying in 2s" >&2; sleep 2; }
    done
    wait "$$child" 2>/dev/null || true

networks:
  net_core:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24
  net_node1:
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/24
  net_node2:
    driver: bridge
    ipam:
      config:
        - subnet: 172.27.0.0/24
  # Node 3 sits behind a NAT: its router masquerades outbound traffic and nothing
  # outside is given a route back in. See router-3.
  net_node3:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24

services:
  # --- control plane (net_core) ---
  # Every service authenticates with a shared bearer token per API surface, and
  # refuses to start without one. The bench defaults below keep `just up` a single
  # command; export WEAVE_{NORTHBOUND,SOUTHBOUND}_TOKEN to override. They are
  # development values, not secrets — the bench sits on a private subnet.
  northbound:
    <<: *weave
    container_name: ow-northbound
    command: ["weave-northbound"]
    environment:
      WEAVE_NORTHBOUND_ADDR: 0.0.0.0:9080
      WEAVE_CONTROLLER_URL: http://172.25.0.22:8082
      WEAVE_NORTHBOUND_TOKEN: ${WEAVE_NORTHBOUND_TOKEN:-bench-northbound-token}
    ports:
      - "29080:9080"
    networks:
      net_core:
        ipv4_address: 172.25.0.20
    depends_on:
      controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  southbound:
    <<: *weave
    container_name: ow-southbound
    command: ["weave-southbound"]
    environment:
      WEAVE_SOUTHBOUND_ADDR: 0.0.0.0:8081
      WEAVE_CONTROLLER_URL: http://172.25.0.22:8082
      WEAVE_SOUTHBOUND_TOKEN: ${WEAVE_SOUTHBOUND_TOKEN:-bench-southbound-token}
    ports:
      - "29081:8081"
    networks:
      net_core:
        ipv4_address: 172.25.0.21
    depends_on:
      controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  controller:
    <<: *weave
    container_name: ow-controller
    command: ["weave-controller"]
    environment:
      WEAVE_CONTROLLER_ADDR: 0.0.0.0:8082
      WEAVE_RECONCILE_INTERVAL_SECS: "5"
      DATABASE_URL: postgres://weave:weave@172.25.0.23:5432/weave
      WEAVE_NORTHBOUND_TOKEN: ${WEAVE_NORTHBOUND_TOKEN:-bench-northbound-token}
      WEAVE_SOUTHBOUND_TOKEN: ${WEAVE_SOUTHBOUND_TOKEN:-bench-southbound-token}
    ports:
      - "29082:8082"
    networks:
      net_core:
        ipv4_address: 172.25.0.22
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:16
    container_name: ow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: weave
      POSTGRES_PASSWORD: weave
      POSTGRES_DB: weave
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      net_core:
        ipv4_address: 172.25.0.23
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weave -d weave"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Routes into the node subnets live in each service's netns and are lost when
  # its container restarts or is recreated, so they are asserted continuously
  # from outside rather than by one-shot per-service sidecars. Covers every
  # service that needs them, including the profiled producer/consumer whenever
  # they happen to be up. See scripts/route-manager.sh.
  route-manager:
    image: nicolaka/netshoot:latest
    container_name: ow-route-manager
    restart: unless-stopped
    network_mode: none
    pid: host
    cap_add: [NET_ADMIN, SYS_ADMIN, SYS_PTRACE]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./scripts/route-manager.sh:/route-manager.sh:ro
    entrypoint: ["bash", "/route-manager.sh"]
    depends_on:
      router-1:
        condition: service_started
      router-2:
        condition: service_started
      router-3:
        condition: service_started

  # --- routers (L3 hop per node; netem is applied on these) ---
  router-1:
    image: nicolaka/netshoot:latest
    container_name: ow-router-1
    cap_add: [NET_ADMIN]
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      net_core:
        ipv4_address: 172.25.0.11
      net_node1:
        ipv4_address: 172.26.0.2
    command:
      - sh
      - -c
      - "ip route replace 172.27.0.0/24 via 172.25.0.12 || true; for d in $$(ls /sys/class/net | grep -v lo); do tc qdisc del dev $$d root 2>/dev/null; done; exec sleep infinity"

  router-2:
    image: nicolaka/netshoot:latest
    container_name: ow-router-2
    cap_add: [NET_ADMIN]
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      net_core:
        ipv4_address: 172.25.0.12
      net_node2:
        ipv4_address: 172.27.0.2
    command:
      - sh
      - -c
      - "ip route replace 172.26.0.0/24 via 172.25.0.11 || true; for d in $$(ls /sys/class/net | grep -v lo); do tc qdisc del dev $$d root 2>/dev/null; done; exec sleep infinity"

  # Node 3's router is a NAT gateway, not a plain L3 hop like routers 1 and 2.
  # Two things make it one, and both matter:
  #
  #   * MASQUERADE rewrites node-3's source address to this router's core-side
  #     IP, so replies come back here and conntrack returns them. Without it,
  #     node-3's outbound traffic would be answered to an address nobody routes.
  #   * Nothing outside net_node3 is ever given a route to 172.29.0.0/24 — not
  #     the core containers, not routers 1 and 2 (see scripts/route-manager.sh).
  #     Docker's inter-network isolation blocks the bridge-level path, so with no
  #     route installed there is genuinely no way to dial in.
  #
  # That is the whole NAT: node-3 can open connections outward and nothing can
  # open one toward it. The routes out are one-way on purpose; do not "fix" the
  # asymmetry by adding a return route, which would quietly delete the boundary
  # every NAT test here depends on.
  router-3:
    image: nicolaka/netshoot:latest
    container_name: ow-router-3
    cap_add: [NET_ADMIN]
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      net_core:
        ipv4_address: 172.25.0.13
      net_node3:
        ipv4_address: 172.29.0.2
    command:
      - sh
      - -c
      - "ip route replace 172.26.0.0/24 via 172.25.0.11 || true; ip route replace 172.27.0.0/24 via 172.25.0.12 || true; iptables -t nat -C POSTROUTING -s 172.29.0.0/24 ! -d 172.29.0.0/24 -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -s 172.29.0.0/24 ! -d 172.29.0.0/24 -j MASQUERADE; for d in $$(ls /sys/class/net | grep -v lo); do tc qdisc del dev $$d root 2>/dev/null; done; exec sleep infinity"

  # --- node 1 (net_node1) ---
  strom-1:
    image: eyevinntechnology/strom:latest
    container_name: ow-strom-1
    environment:
      STROM_PORT: "8080"
      STROM_DATA_DIR: /data
    volumes:
      - strom1-data:/data
    ports:
      - "28080:8080"
    networks:
      net_node1:
        ipv4_address: 172.26.0.10
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  adapter-1:
    <<: *weave
    container_name: ow-adapter-1
    command: ["weave-adapter-strom", "--config", "/etc/weave/node.yaml"]
    environment:
      WEAVE_SOUTHBOUND_TOKEN: ${WEAVE_SOUTHBOUND_TOKEN:-bench-southbound-token}
    volumes:
      - ./config/adapter-1.yaml:/etc/weave/node.yaml:ro
    networks:
      net_node1:
        ipv4_address: 172.26.0.11
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8091/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # --- node 2 (net_node2) ---
  strom-2:
    image: eyevinntechnology/strom:latest
    container_name: ow-strom-2
    environment:
      STROM_PORT: "8080"
      STROM_DATA_DIR: /data
    volumes:
      - strom2-data:/data
    ports:
      - "28081:8080"
    networks:
      net_node2:
        ipv4_address: 172.27.0.10
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  adapter-2:
    <<: *weave
    container_name: ow-adapter-2
    command: ["weave-adapter-strom", "--config", "/etc/weave/node.yaml"]
    environment:
      WEAVE_SOUTHBOUND_TOKEN: ${WEAVE_SOUTHBOUND_TOKEN:-bench-southbound-token}
    volumes:
      - ./config/adapter-2.yaml:/etc/weave/node.yaml:ro
    networks:
      net_node2:
        ipv4_address: 172.27.0.11
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8091/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # --- node 3 (net_node3, behind NAT) ---
  strom-3:
    image: eyevinntechnology/strom:latest
    container_name: ow-strom-3
    environment:
      STROM_PORT: "8080"
      STROM_DATA_DIR: /data
    volumes:
      - strom3-data:/data
    # Published for debugging from the host. This is a host→container path
    # through docker-proxy and gives no container a route into net_node3, so the
    # NAT boundary the media crosses is unaffected.
    ports:
      - "28082:8080"
    networks:
      net_node3:
        ipv4_address: 172.29.0.10
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  adapter-3:
    <<: *weave
    container_name: ow-adapter-3
    command: ["weave-adapter-strom", "--config", "/etc/weave/node.yaml"]
    environment:
      WEAVE_SOUTHBOUND_TOKEN: ${WEAVE_SOUTHBOUND_TOKEN:-bench-southbound-token}
    volumes:
      - ./config/adapter-3.yaml:/etc/weave/node.yaml:ro
    networks:
      net_node3:
        ipv4_address: 172.29.0.11
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8091/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # --- external verification endpoints (NOT part of the system) ---
  # Off by default (profiles). Started explicitly via the bench producer/consumer
  # recipes so status transitions can be demonstrated.
  #
  # The net_core pair act as real external peers, routing to node subnets through
  # the netem routers. The net_node3 pair exist because node 3 is behind NAT: its
  # sockets listen, but nothing outside can dial them, so a peer that drives them
  # has to sit inside the site. That is not a bench workaround — it is the same
  # constraint that makes a NAT'd site run its own encoder and decoder.
  producer:
    <<: *media
    container_name: ow-producer
    profiles: ["producer"]
    environment:
      - PRODUCER_TARGET
    networks:
      net_core:
        ipv4_address: 172.25.0.30
    command: *producer-command

  consumer:
    <<: *media
    container_name: ow-consumer
    profiles: ["consumer"]
    environment:
      - CONSUMER_SOURCE
    networks:
      net_core:
        ipv4_address: 172.25.0.31
    command: *consumer-command

  # Second consumer for fan-out: attach one consumer per receiver output so all
  # receiver hops can flow simultaneously (rollup needs every hop flowing).
  consumer-2:
    <<: *media
    container_name: ow-consumer-2
    profiles: ["consumer"]
    environment:
      CONSUMER_SOURCE: ${CONSUMER_SOURCE_2:-}
    networks:
      net_core:
        ipv4_address: 172.25.0.32
    command: *consumer-command

  producer-3:
    <<: *media
    container_name: ow-producer-3
    profiles: ["producer"]
    environment:
      - PRODUCER_TARGET
    networks:
      net_node3:
        ipv4_address: 172.29.0.30
    command: *producer-command

  consumer-3:
    <<: *media
    container_name: ow-consumer-3
    profiles: ["consumer"]
    environment:
      - CONSUMER_SOURCE
    networks:
      net_node3:
        ipv4_address: 172.29.0.31
    command: *consumer-command

volumes:
  strom1-data:
  strom2-data:
  strom3-data:
  pgdata:
