name: ow-bench

x-weave: &weave
  image: open-weave-bench:local
  build:
    context: ..
    dockerfile: bench/Dockerfile
  restart: unless-stopped

# External verification endpoints share one ffmpeg loop each; only the container
# name, address and subnet differ. Every consumer reads CONSUMER_SOURCE, so a
# service that takes its value from a different host variable remaps it in its
# own `environment` block rather than forking the command.
x-media: &media
  image: linuxserver/ffmpeg:latest
  restart: "no"
  entrypoint: ["/bin/bash", "-c"]

x-producer-command: &producer-command
  - |
    running=1
    trap 'running=0; kill -TERM "$$child" 2>/dev/null' TERM INT
    while [ "$$running" = 1 ]; do
      ffmpeg -hide_banner -loglevel warning -re \
        -f lavfi -i testsrc2=size=1280x720:rate=30 \
        -f lavfi -i sine=frequency=1000:sample_rate=48000 \
        -c:v libx264 -preset veryfast -tune zerolatency -b:v 2500k -pix_fmt yuv420p -g 60 \
        -c:a aac -b:a 128k \
        -f mpegts "srt://$${PRODUCER_TARGET:?PRODUCER_TARGET is required (resolve via scripts/endpoints.sh)}?mode=caller&latency=200&streamid=producer$${PRODUCER_PASSPHRASE:+&passphrase=$$PRODUCER_PASSPHRASE}" &
      child=$$!
      wait "$$child" || true
      [ "$$running" = 1 ] && { echo "producer ffmpeg exited; retrying in 2s" >&2; sleep 2; }
    done
    wait "$$child" 2>/dev/null || true

x-consumer-command: &consumer-command
  - |
    running=1
    trap 'running=0; kill -TERM "$$child" 2>/dev/null' TERM INT
    while [ "$$running" = 1 ]; do
      ffmpeg -hide_banner -loglevel warning \
        -i "srt://$${CONSUMER_SOURCE:?CONSUMER_SOURCE is required (resolve via scripts/endpoints.sh)}?mode=caller&latency=200$${CONSUMER_PASSPHRASE:+&passphrase=$$CONSUMER_PASSPHRASE}" \
        -f null - &
      child=$$!
      wait "$$child" || true
      [ "$$running" = 1 ] && { echo "consumer ffmpeg exited; retrying in 2s" >&2; sleep 2; }
    done
    wait "$$child" 2>/dev/null || true

networks:
  net_core:
    driver: bridge
    ipam:
      config:
        - subnet: 10.97.25.0/24
  net_node1:
    driver: bridge
    ipam:
      config:
        - subnet: 10.97.26.0/24
  net_node2:
    driver: bridge
    ipam:
      config:
        - subnet: 10.97.27.0/24
  # Nodes 3 and 4 each sit behind a NAT: their router masquerades outbound
  # traffic and nothing outside is given a route back in. See router-3.
  net_node3:
    driver: bridge
    ipam:
      config:
        - subnet: 10.97.29.0/24
  net_node4:
    driver: bridge
    ipam:
      config:
        - subnet: 10.97.30.0/24

services:
  # --- control plane (net_core) ---
  # Northbound takes one shared bearer token. Southbound and the controller hold
  # WEAVE_SOUTHBOUND_KEY and take from each node a token derived from it for that
  # node's id (`weave node-token <id>`). The controller also derives SRT link keys
  # from WEAVE_SRT_KEY_SECRET. Every service refuses to start without its secret.
  # The bench defaults below keep `just up` a single command, and the
  # node tokens are the ones the default key gives: exporting WEAVE_SOUTHBOUND_KEY
  # means exporting WEAVE_ADAPTER_{1,2,3,4}_TOKEN and WEAVE_BROWSER_TOKEN too.
  # They are development values, not secrets — the bench sits on a private
  # subnet.
  northbound:
    <<: *weave
    container_name: ow-northbound
    command: ["weave-northbound"]
    environment:
      WEAVE_NORTHBOUND_ADDR: 0.0.0.0:9080
      WEAVE_CONTROLLER_URL: http://10.97.25.22:8082,http://10.97.25.24:8082
      WEAVE_NORTHBOUND_TOKEN: ${WEAVE_NORTHBOUND_TOKEN:-bench-northbound-token}
    ports:
      - "29080:9080"
    networks:
      net_core:
        ipv4_address: 10.97.25.20
    depends_on:
      controller:
        condition: service_healthy
      controller-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  southbound:
    <<: *weave
    container_name: ow-southbound
    command: ["weave-southbound"]
    environment:
      WEAVE_SOUTHBOUND_ADDR: 0.0.0.0:8081
      WEAVE_CONTROLLER_URL: http://10.97.25.22:8082,http://10.97.25.24:8082
      WEAVE_SOUTHBOUND_KEY: ${WEAVE_SOUTHBOUND_KEY:-bench-southbound-key-for-local-use-only}
      WEAVE_SOUTHBOUND_MIN_EPOCHS: ${WEAVE_SOUTHBOUND_MIN_EPOCHS:-}
      # The browser node is a web page on another origin. `*` is a development
      # value like the tokens above; a deployment names the page's origin.
      WEAVE_SOUTHBOUND_CORS_ORIGIN: ${WEAVE_SOUTHBOUND_CORS_ORIGIN:-*}
    ports:
      - "29081:8081"
    networks:
      net_core:
        ipv4_address: 10.97.25.21
    depends_on:
      controller:
        condition: service_healthy
      controller-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Two controllers share one Postgres. The one holding the lease serves; the
  # other answers `503 not_leader` until it can take the lease over.
  controller: &controller
    <<: *weave
    container_name: ow-controller
    command: ["weave-controller"]
    environment:
      WEAVE_CONTROLLER_ADDR: 0.0.0.0:8082
      WEAVE_RECONCILE_INTERVAL_SECS: "5"
      DATABASE_URL: postgres://weave:weave@10.97.25.23:5432/weave
      WEAVE_NORTHBOUND_TOKEN: ${WEAVE_NORTHBOUND_TOKEN:-bench-northbound-token}
      WEAVE_SOUTHBOUND_KEY: ${WEAVE_SOUTHBOUND_KEY:-bench-southbound-key-for-local-use-only}
      WEAVE_SOUTHBOUND_MIN_EPOCHS: ${WEAVE_SOUTHBOUND_MIN_EPOCHS:-}
      WEAVE_SRT_KEY_SECRET: ${WEAVE_SRT_KEY_SECRET:-bench-srt-key-secret-for-local-use-only}
      # Webhooks, delivered to `just bench hook-sink` on this
      # host. Unset WEAVE_WEBHOOK_URL to switch them off.
      WEAVE_WEBHOOK_URL: ${WEAVE_WEBHOOK_URL-http://host.docker.internal:29099}
      WEAVE_WEBHOOK_TOKEN: ${WEAVE_WEBHOOK_TOKEN:-bench-webhook-token}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "29082:8082"
    networks:
      net_core:
        ipv4_address: 10.97.25.22
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  controller-2:
    <<: *controller
    container_name: ow-controller-2
    ports:
      - "29083:8082"
    networks:
      net_core:
        ipv4_address: 10.97.25.24

  postgres:
    image: postgres:16
    container_name: ow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: weave
      POSTGRES_PASSWORD: weave
      POSTGRES_DB: weave
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      net_core:
        ipv4_address: 10.97.25.23
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weave -d weave"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # --- TLS (net_core) ---
  # nginx terminates TLS for northbound and southbound; the services behind it
  # serve plain HTTP, and their plaintext ports stay published. The adapters and
  # the browser page dial southbound through it and trust the bench CA that
  # tls-certs generates into ./tls.
  tls-certs:
    image: nicolaka/netshoot:latest
    container_name: ow-tls-certs
    restart: "no"
    network_mode: none
    volumes:
      - ./tls:/tls
      - ./scripts/tls-certs.sh:/tls-certs.sh:ro
    entrypoint: ["sh", "/tls-certs.sh", "/tls"]

  tls:
    image: nginx:alpine
    container_name: ow-tls
    restart: unless-stopped
    volumes:
      - ./config/tls-proxy.conf:/etc/nginx/nginx.conf:ro
      - ./tls/server:/tls:ro
    ports:
      - "29443:9443"
      - "29444:8443"
    networks:
      net_core:
        ipv4_address: 10.97.25.25
    depends_on:
      tls-certs:
        condition: service_completed_successfully
      northbound:
        condition: service_healthy
      southbound:
        condition: service_healthy

  # Routes into the node subnets live in each service's netns and are lost when
  # its container restarts or is recreated, so they are asserted continuously
  # from outside rather than by one-shot per-service sidecars. Covers every
  # service that needs them, including the profiled producer/consumer whenever
  # they happen to be up. See scripts/route-manager.sh.
  route-manager:
    image: nicolaka/netshoot:latest
    container_name: ow-route-manager
    restart: unless-stopped
    network_mode: none
    pid: host
    cap_add: [NET_ADMIN, SYS_ADMIN, SYS_PTRACE]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./scripts/route-manager.sh:/route-manager.sh:ro
    entrypoint: ["bash", "/route-manager.sh"]
    depends_on:
      router-1:
        condition: service_started
      router-2:
        condition: service_started
      router-3:
        condition: service_started
      router-4:
        condition: service_started

  # --- routers (L3 hop per node; netem is applied on these) ---
  router-1:
    image: nicolaka/netshoot:latest
    container_name: ow-router-1
    cap_add: [NET_ADMIN]
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      net_core:
        ipv4_address: 10.97.25.11
      net_node1:
        ipv4_address: 10.97.26.2
    command:
      - sh
      - -c
      - "ip route replace 10.97.27.0/24 via 10.97.25.12 || true; for d in $$(ls /sys/class/net | grep -v lo); do tc qdisc del dev $$d root 2>/dev/null; done; exec sleep infinity"

  router-2:
    image: nicolaka/netshoot:latest
    container_name: ow-router-2
    cap_add: [NET_ADMIN]
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      net_core:
        ipv4_address: 10.97.25.12
      net_node2:
        ipv4_address: 10.97.27.2
    command:
      - sh
      - -c
      - "ip route replace 10.97.26.0/24 via 10.97.25.11 || true; for d in $$(ls /sys/class/net | grep -v lo); do tc qdisc del dev $$d root 2>/dev/null; done; exec sleep infinity"

  # Node 3's router is a NAT gateway, not a plain L3 hop like routers 1 and 2,
  # and router-4 is the same for node 4. Two things make one, and both matter:
  #
  #   * MASQUERADE rewrites node-3's source address to this router's core-side
  #     IP, so replies come back here and conntrack returns them. Without it,
  #     node-3's outbound traffic would be answered to an address nobody routes.
  #   * Nothing outside net_node3 is ever given a route to 10.97.29.0/24 — not
  #     the core containers, not routers 1, 2 and 4, not node 4
  #     (see scripts/route-manager.sh). Docker's inter-network isolation blocks
  #     the bridge-level path, so with no route installed there is genuinely no
  #     way to dial in.
  #
  # That is the whole NAT: node-3 can open connections outward and nothing can
  # open one toward it. The routes out are one-way on purpose; do not "fix" the
  # asymmetry by adding a return route, which would quietly delete the boundary
  # every NAT test here depends on. The same holds for node 4 and 10.97.30.0/24,
  # so neither NAT'd site can reach the other directly.
  router-3:
    image: nicolaka/netshoot:latest
    container_name: ow-router-3
    cap_add: [NET_ADMIN]
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      net_core:
        ipv4_address: 10.97.25.13
      net_node3:
        ipv4_address: 10.97.29.2
    command:
      - sh
      - -c
      - "ip route replace 10.97.26.0/24 via 10.97.25.11 || true; ip route replace 10.97.27.0/24 via 10.97.25.12 || true; iptables -t nat -C POSTROUTING -s 10.97.29.0/24 ! -d 10.97.29.0/24 -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -s 10.97.29.0/24 ! -d 10.97.29.0/24 -j MASQUERADE; for d in $$(ls /sys/class/net | grep -v lo); do tc qdisc del dev $$d root 2>/dev/null; done; exec sleep infinity"

  router-4:
    image: nicolaka/netshoot:latest
    container_name: ow-router-4
    cap_add: [NET_ADMIN]
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      net_core:
        ipv4_address: 10.97.25.14
      net_node4:
        ipv4_address: 10.97.30.2
    command:
      - sh
      - -c
      - "ip route replace 10.97.26.0/24 via 10.97.25.11 || true; ip route replace 10.97.27.0/24 via 10.97.25.12 || true; iptables -t nat -C POSTROUTING -s 10.97.30.0/24 ! -d 10.97.30.0/24 -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -s 10.97.30.0/24 ! -d 10.97.30.0/24 -j MASQUERADE; for d in $$(ls /sys/class/net | grep -v lo); do tc qdisc del dev $$d root 2>/dev/null; done; exec sleep infinity"

  # --- node 1 (net_node1) ---
  strom-1:
    image: eyevinntechnology/strom:0.6.10
    container_name: ow-strom-1
    environment:
      STROM_PORT: "8080"
      STROM_DATA_DIR: /data
    volumes:
      - strom1-data:/data
    ports:
      - "28080:8080"
    networks:
      net_node1:
        ipv4_address: 10.97.26.10
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  adapter-1:
    <<: *weave
    container_name: ow-adapter-1
    command: ["weave-adapter-strom", "--config", "/etc/weave/node.yaml"]
    environment:
      WEAVE_SOUTHBOUND_TOKEN: ${WEAVE_ADAPTER_1_TOKEN:-strom-node-1.0.dc18eb10e0f080536c55f9ff6569abb31d2da3ce4f782b294dd0d32fcbd8dbaf}
      SSL_CERT_FILE: /tls/ca.pem
    volumes:
      - ./config/adapter-1.yaml:/etc/weave/node.yaml:ro
      - ./tls/public:/tls:ro
    depends_on:
      tls-certs:
        condition: service_completed_successfully
    networks:
      net_node1:
        ipv4_address: 10.97.26.11
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8091/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # --- node 2 (net_node2) ---
  strom-2:
    image: eyevinntechnology/strom:0.6.10
    container_name: ow-strom-2
    environment:
      STROM_PORT: "8080"
      STROM_DATA_DIR: /data
    volumes:
      - strom2-data:/data
    ports:
      - "28081:8080"
    networks:
      net_node2:
        ipv4_address: 10.97.27.10
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  adapter-2:
    <<: *weave
    container_name: ow-adapter-2
    command: ["weave-adapter-strom", "--config", "/etc/weave/node.yaml"]
    environment:
      WEAVE_SOUTHBOUND_TOKEN: ${WEAVE_ADAPTER_2_TOKEN:-strom-node-2.0.f6a9e27d3f0c5cac5cadb705f27e8659a31a43836822b29d2aac602607ea79f3}
      SSL_CERT_FILE: /tls/ca.pem
    volumes:
      - ./config/${WEAVE_ADAPTER_2_CONFIG:-adapter-2.yaml}:/etc/weave/node.yaml:ro
      - ./tls/public:/tls:ro
    depends_on:
      tls-certs:
        condition: service_completed_successfully
    networks:
      net_node2:
        ipv4_address: 10.97.27.11
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8091/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # --- node 3 (net_node3, behind NAT) ---
  strom-3:
    image: eyevinntechnology/strom:0.6.10
    container_name: ow-strom-3
    environment:
      STROM_PORT: "8080"
      STROM_DATA_DIR: /data
    volumes:
      - strom3-data:/data
    # Published for debugging from the host. This is a host→container path
    # through docker-proxy and gives no container a route into net_node3, so the
    # NAT boundary the media crosses is unaffected.
    ports:
      - "28082:8080"
    networks:
      net_node3:
        ipv4_address: 10.97.29.10
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  adapter-3:
    <<: *weave
    container_name: ow-adapter-3
    command: ["weave-adapter-strom", "--config", "/etc/weave/node.yaml"]
    environment:
      WEAVE_SOUTHBOUND_TOKEN: ${WEAVE_ADAPTER_3_TOKEN:-strom-node-3.0.63f1a6fc0325ad42d897365d027ebbc08c60b9f4b5a3f82c4ff1cda8cb5ca267}
      SSL_CERT_FILE: /tls/ca.pem
    volumes:
      - ./config/adapter-3.yaml:/etc/weave/node.yaml:ro
      - ./tls/public:/tls:ro
    depends_on:
      tls-certs:
        condition: service_completed_successfully
    networks:
      net_node3:
        ipv4_address: 10.97.29.11
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8091/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # --- node 4 (net_node4, behind its own NAT) ---
  strom-4:
    image: eyevinntechnology/strom:0.6.10
    container_name: ow-strom-4
    environment:
      STROM_PORT: "8080"
      STROM_DATA_DIR: /data
    volumes:
      - strom4-data:/data
    # Published for debugging from the host, like strom-3's.
    ports:
      - "28083:8080"
    networks:
      net_node4:
        ipv4_address: 10.97.30.10
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  adapter-4:
    <<: *weave
    container_name: ow-adapter-4
    command: ["weave-adapter-strom", "--config", "/etc/weave/node.yaml"]
    environment:
      WEAVE_SOUTHBOUND_TOKEN: ${WEAVE_ADAPTER_4_TOKEN:-strom-node-4.0.dc5a557a1c746f319ed4f7590f21a9aaa5c19d0d4ffcff9d0ecd81ca1f69c14f}
      SSL_CERT_FILE: /tls/ca.pem
    volumes:
      - ./config/adapter-4.yaml:/etc/weave/node.yaml:ro
      - ./tls/public:/tls:ro
    depends_on:
      tls-certs:
        condition: service_completed_successfully
    networks:
      net_node4:
        ipv4_address: 10.97.30.11
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8091/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # --- browser node (net_core, profile) ---
  # On net_core so its WebRTC media reaches Strom's ICE candidates on the node
  # subnets; a browser on a macOS host has no route there. See bench/README.md.
  browser:
    build:
      context: ..
      dockerfile: bench/Dockerfile.browser
    image: open-weave-bench-browser:local
    container_name: ow-browser
    profiles: ["browser"]
    restart: "no"
    shm_size: "1gb"
    environment:
      WEAVE_SOUTHBOUND_URL: https://10.97.25.25:8443
      WEAVE_SOUTHBOUND_TOKEN: ${WEAVE_BROWSER_TOKEN:-browser-bench.0.ed7971623b06be894b581ccca99662bdb3983d232e8737a2c3e5a46455b00540}
      # check.mjs polls southbound from Node, which reads this.
      NODE_EXTRA_CA_CERTS: /tls/ca.pem
      # `video` sends the camera without the microphone (`just bench browser-up video`).
      WEAVE_BROWSER_MEDIA: ${WEAVE_BROWSER_MEDIA:-}
    volumes:
      - ../nodes/browser:/work:ro
      - ./tls/public:/tls:ro
      # check.mjs compares the page's PROTOCOL_VERSION with the Rust constant and
      # looks for it two levels above the page, so /work needs this beside it or
      # the comparison is skipped.
      - ../crates/core/src/lib.rs:/crates/core/src/lib.rs:ro
    networks:
      net_core:
        ipv4_address: 10.97.25.40
    depends_on:
      tls-certs:
        condition: service_completed_successfully
    # Chromium trusts the bench CA through the NSS database it reads on Linux,
    # which certutil fills before the page is opened. The page takes its node id
    # from its token, so the browser manifests keep naming the same node across
    # restarts; the `browser-id` recipe reads the id off the same default token.
    command:
      - sh
      - -c
      - |
        set -e
        db="sql:$$HOME/.pki/nssdb"
        mkdir -p "$$HOME/.pki/nssdb"
        [ -f "$$HOME/.pki/nssdb/cert9.db" ] || certutil -d "$$db" -N --empty-password
        certutil -d "$$db" -A -t C,, -n open-weave-bench-ca -i /tls/ca.pem
        exec node /work/check.mjs --serve 8000 --stay

  # A second page, node `browser-bench-2`, for a stream from one page's camera to
  # another page's screen (`just bench browser-b2b`). Started by `browser-2-up`.
  browser-2:
    image: open-weave-bench-browser:local
    container_name: ow-browser-2
    profiles: ["browser"]
    restart: "no"
    shm_size: "1gb"
    environment:
      WEAVE_SOUTHBOUND_URL: https://10.97.25.25:8443
      WEAVE_SOUTHBOUND_TOKEN: ${WEAVE_BROWSER_2_TOKEN:-browser-bench-2.0.01b7733061b2fec1c70751c03fd9c027e962589084f12bbb6cee4c9a9e65ea82}
      NODE_EXTRA_CA_CERTS: /tls/ca.pem
    volumes:
      - ../nodes/browser:/work:ro
      - ./tls/public:/tls:ro
      - ../crates/core/src/lib.rs:/crates/core/src/lib.rs:ro
    networks:
      net_core:
        ipv4_address: 10.97.25.41
    depends_on:
      tls-certs:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - |
        set -e
        db="sql:$$HOME/.pki/nssdb"
        mkdir -p "$$HOME/.pki/nssdb"
        [ -f "$$HOME/.pki/nssdb/cert9.db" ] || certutil -d "$$db" -N --empty-password
        certutil -d "$$db" -A -t C,, -n open-weave-bench-ca -i /tls/ca.pem
        exec node /work/check.mjs --serve 8000 --stay

  # --- external verification endpoints (NOT part of the system) ---
  # Off by default (profiles). Started explicitly via the bench producer/consumer
  # recipes so status transitions can be demonstrated.
  #
  # The net_core pair act as real external peers, routing to node subnets through
  # the netem routers. The net_node3 and net_node4 pairs exist because nodes 3
  # and 4 are behind NAT: their sockets listen, but nothing outside can dial
  # them, so a peer that drives them has to sit inside the site. That is not a bench workaround — it is the same
  # constraint that makes a NAT'd site run its own encoder and decoder.
  producer:
    <<: *media
    container_name: ow-producer
    profiles: ["producer"]
    environment:
      - PRODUCER_TARGET
      - PRODUCER_PASSPHRASE
    networks:
      net_core:
        ipv4_address: 10.97.25.30
    command: *producer-command

  consumer:
    <<: *media
    container_name: ow-consumer
    profiles: ["consumer"]
    environment:
      - CONSUMER_SOURCE
      - CONSUMER_PASSPHRASE
    networks:
      net_core:
        ipv4_address: 10.97.25.31
    command: *consumer-command

  # Second consumer for fan-out: attach one consumer per receiver output so all
  # receiver hops can flow simultaneously (rollup needs every hop flowing).
  consumer-2:
    <<: *media
    container_name: ow-consumer-2
    profiles: ["consumer"]
    environment:
      CONSUMER_SOURCE: ${CONSUMER_SOURCE_2:-}
      CONSUMER_PASSPHRASE: ${CONSUMER_PASSPHRASE_2:-}
    networks:
      net_core:
        ipv4_address: 10.97.25.32
    command: *consumer-command

  producer-3:
    <<: *media
    container_name: ow-producer-3
    profiles: ["producer"]
    environment:
      - PRODUCER_TARGET
      - PRODUCER_PASSPHRASE
    networks:
      net_node3:
        ipv4_address: 10.97.29.30
    command: *producer-command

  consumer-3:
    <<: *media
    container_name: ow-consumer-3
    profiles: ["consumer"]
    environment:
      - CONSUMER_SOURCE
      - CONSUMER_PASSPHRASE
    networks:
      net_node3:
        ipv4_address: 10.97.29.31
    command: *consumer-command

  producer-4:
    <<: *media
    container_name: ow-producer-4
    profiles: ["producer"]
    environment:
      - PRODUCER_TARGET
      - PRODUCER_PASSPHRASE
    networks:
      net_node4:
        ipv4_address: 10.97.30.30
    command: *producer-command

  consumer-4:
    <<: *media
    container_name: ow-consumer-4
    profiles: ["consumer"]
    environment:
      - CONSUMER_SOURCE
      - CONSUMER_PASSPHRASE
    networks:
      net_node4:
        ipv4_address: 10.97.30.31
    command: *consumer-command

