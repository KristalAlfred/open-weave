name: ow-bench

networks:
  net_ingress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  net_egress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24

services:
  # L3 hop between the two node networks. netem qdiscs are applied here to
  # impair the strom-ingress <-> strom-egress contribution link.
  router:
    image: nicolaka/netshoot:latest
    container_name: bench-router
    cap_add: [NET_ADMIN]
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      net_ingress:
        ipv4_address: 172.30.0.2
      net_egress:
        ipv4_address: 172.31.0.2
    command: ["sh", "-c", "for d in $(ls /sys/class/net | grep -v lo); do tc qdisc del dev $d root 2>/dev/null; done; exec sleep infinity"]

  strom-ingress:
    image: eyevinntechnology/strom:latest
    container_name: bench-strom-ingress
    cap_add: [NET_ADMIN]
    networks:
      net_ingress:
        ipv4_address: 172.30.0.10
    ports:
      - "18080:8080"

  # Adds strom-ingress's route to the egress subnet via the router, then exits.
  # Shares strom-ingress's netns because the strom image has no `ip` tool.
  route-ingress:
    image: nicolaka/netshoot:latest
    container_name: bench-route-ingress
    network_mode: "service:strom-ingress"
    cap_add: [NET_ADMIN]
    command: ["sh", "-c", "for i in 1 2 3 4 5; do ip route replace 172.31.0.0/24 via 172.30.0.2 && echo 'route -> net_egress installed' && exit 0; echo retry $i; sleep 1; done; echo 'route install FAILED' >&2; exit 1"]
    depends_on:
      - strom-ingress

  strom-egress:
    image: eyevinntechnology/strom:latest
    container_name: bench-strom-egress
    cap_add: [NET_ADMIN]
    networks:
      net_egress:
        ipv4_address: 172.31.0.10
    ports:
      - "18081:8080"

  route-egress:
    image: nicolaka/netshoot:latest
    container_name: bench-route-egress
    network_mode: "service:strom-egress"
    cap_add: [NET_ADMIN]
    command: ["sh", "-c", "for i in 1 2 3 4 5; do ip route replace 172.30.0.0/24 via 172.31.0.2 && echo 'route -> net_ingress installed' && exit 0; echo retry $i; sleep 1; done; echo 'route install FAILED' >&2; exit 1"]
    depends_on:
      - strom-egress

  # testsrc2 + burnt-in timecode/frame counter + sine tone, H.264+AAC in MPEG-TS,
  # SRT caller into strom-ingress. Retries until the ingress srtsrc listener exists.
  producer:
    image: linuxserver/ffmpeg:latest
    container_name: bench-producer
    entrypoint: ["/bin/sh"]
    command: ["/bench/producer.sh"]
    volumes:
      - ./scripts:/bench:ro
    networks:
      net_ingress:
        ipv4_address: 172.30.0.20
    restart: unless-stopped

  # SRT caller pulling the delivered stream from strom-egress; freeze/black
  # detection + MPEG-TS continuity errors logged to stdout.
  consumer:
    image: linuxserver/ffmpeg:latest
    container_name: bench-consumer
    entrypoint: ["/bin/sh"]
    command: ["/bench/consumer.sh"]
    volumes:
      - ./scripts:/bench:ro
    networks:
      net_egress:
        ipv4_address: 172.31.0.20
    restart: unless-stopped
