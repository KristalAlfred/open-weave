# Fan-out demonstrating node-referenced addressing: destinations name their node
# instead of a raw IP. The first uses the node's default data-plane address; the
# second pins the `wan` alias. The controller resolves both at planning time and
# assigns ports from each node's declared range.
name: cam1-to-studio
enabled: true
source:
  srt:
    node: strom-node-1
    latency: 200
destinations:
  - srt:
      node: strom-node-2
  - srt:
      node: strom-node-2
      network: wan
