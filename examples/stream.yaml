# Fan-out demonstrating node-referenced addressing: destinations name their node
# instead of a raw IP. The first uses the node's default data-plane address; the
# second pins the `wan` alias. The controller resolves both at planning time and
# assigns ports from each node's declared range.
name: cam1-to-studio
enabled: true
source:
  srt:
    node: strom-node-1
    latency: 200
destinations:
  - srt:
      node: strom-node-2
  - srt:
      node: strom-node-2
      network: wan
  # A destination may instead dial out to an external SRT listener. No node
  # hosts it and no port is assigned; the sender just adds a caller egress.
  # - srt:
  #     remote:
  #       host: 198.51.100.5
  #       port: 9000
  # A destination may pin the nodes it relays through, upstream-first. Each
  # becomes a bridge hop. Pins are policy — forcing traffic through a site — and
  # are honoured even when the link would have resolved directly. The controller
  # inserts a relay on its own when neither end of a link can be dialled, so NAT
  # traversal needs no pin.
  # - srt:
  #     node: strom-node-2
  #     via: [edge-relay]
