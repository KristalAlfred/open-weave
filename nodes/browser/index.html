<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>open-weave browser node</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1d21; --muted: #6b7280; --faint: #9ca3af;
    --hairline: #e5e7eb; --chip: #f3f4f6;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --green: #16a34a; --amber: #d97706; --red: #dc2626; --gray: #9ca3af;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101214; --fg: #e6e8ea; --muted: #9aa2ab; --faint: #6b7280;
      --hairline: #23272c; --chip: #191d21;
      --green: #4ade80; --amber: #fbbf24; --red: #f87171; --gray: #6b7280;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 64rem; margin: 0 auto; padding: 1.5rem 2rem 4rem; }
  header { display: flex; align-items: baseline; gap: 0.75rem; padding-bottom: 1rem; border-bottom: 1px solid var(--hairline); flex-wrap: wrap; }
  header h1 { font-size: 1rem; font-weight: 600; margin: 0; }
  header .id { font-family: var(--mono); }
  header .sb { margin-left: auto; color: var(--faint); font-family: var(--mono); font-size: 0.75rem; }
  section { margin-top: 1.75rem; }
  h2 { font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); margin: 0 0 0.75rem; }
  .pill { display: inline-block; font-size: 0.75rem; font-weight: 500; padding: 0 0.5rem; border-radius: 999px; background: var(--chip); }
  .pill.good, .pill.provisioned { color: var(--green); }
  .pill.wait, .pill.pending { color: var(--amber); }
  .pill.bad, .pill.failed { color: var(--red); }
  .fatal { color: var(--red); }
  pre { background: var(--chip); padding: 0.75rem 1rem; border-radius: 6px; font-family: var(--mono); font-size: 0.8125rem; overflow-x: auto; }
  button { font: inherit; font-size: 0.8125rem; padding: 0.25rem 0.75rem; border: 1px solid var(--hairline); border-radius: 6px; background: var(--chip); color: var(--fg); cursor: pointer; }
  .hop { display: flex; align-items: baseline; gap: 0.75rem; padding: 0.375rem 0; border-top: 1px solid var(--hairline); flex-wrap: wrap; }
  .hop:first-child { border-top: 0; }
  .hop .id { font-family: var(--mono); font-size: 0.8125rem; }
  .hop .cond { color: var(--muted); font-size: 0.8125rem; }
  .hop .arrow { color: var(--faint); }
  .hop .rate { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
  .hop .err { color: var(--red); font-size: 0.8125rem; }
  .empty { color: var(--muted); }
  #videos { display: flex; gap: 1rem; flex-wrap: wrap; }
  figure { margin: 0; }
  video { width: 24rem; max-width: 100%; background: #000; border-radius: 6px; }
  figcaption { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem; }
  #log { font-size: 0.75rem; color: var(--muted); white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <header>
    <h1>open-weave browser node</h1>
    <span class="id" id="node-id"></span>
    <span class="pill wait" id="registration">registering</span>
    <span class="sb" id="southbound"></span>
  </header>
  <div class="fatal" id="fatal"></div>
  <section>
    <h2>Manifests naming this node <button id="copy">copy</button></h2>
    <pre id="manifests"></pre>
  </section>
  <section>
    <h2>Hops</h2>
    <div id="hops"></div>
  </section>
  <section>
    <h2>Screens</h2>
    <div id="videos"></div>
  </section>
  <section>
    <h2>Log</h2>
    <div id="log"></div>
  </section>
</main>
<script src="node.js"></script>
</body>
</html>
